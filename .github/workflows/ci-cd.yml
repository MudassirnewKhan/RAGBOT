name: RAGBOT CI/CD Pipeline

on:
  push:
    branches: [ main, feature/* ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Run PyTest Test Suites
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run PyTest
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY || 'mock_test_key' }}
        run: |
          pytest -v

  docker-build:
    name: Build & Verify Docker Image
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          push: false
          tags: ragbot-api:latest

      - name: Test Container Startup & Healthcheck
        run: |
          docker run -d --name test-rag-container -p 8000:8000 -e GROQ_API_KEY=mock_key ragbot-api:latest
          sleep 15
          curl --fail http://localhost:8000/health || exit 1
          docker stop test-rag-container
