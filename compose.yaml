services:
  server:
    build:
      context: .
    container_name: ragbot_production_api
    ports:
      - "8000:8000"
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}
      - LLM_MODEL=${LLM_MODEL:-openai/gpt-oss-20b}
      - PORT=8000
    volumes:
      - ./data:/app/data
      - ./faiss_store:/app/faiss_store
    restart: unless-stopped