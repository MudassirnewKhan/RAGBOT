[project]
name = "ragbot"
version = "0.2.0"
description = "Production RAG pipeline with hybrid search and reranking"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "faiss-cpu>=1.13.0",
    "fastapi>=0.115.0",
    "httpx>=0.28.0",
    "langchain>=1.3.0",
    "langchain-community>=0.4.1",
    "langchain-core>=1.4.0",
    "langchain-groq>=1.1.2",
    "numpy>=2.0.0",
    "pymupdf>=1.27.0",
    "python-dotenv>=1.2.0",
    "python-multipart>=0.0.12",
    "rank-bm25>=0.2.2",
    "sentence-transformers>=5.0.0",
    "tenacity>=9.0.0",
    "uvicorn[standard]>=0.32.0",
]
